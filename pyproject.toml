[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meritorder"
version = "0.1.0"
description = "Stack-based fundamental DE-LU day-ahead price model (European Power Market Lab step 2)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31", "openpyxl>=3.1", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
